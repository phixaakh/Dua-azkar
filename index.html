<!DOCTYPE html>
<html lang="dv" dir="rtl">
<head>
    <meta charset="UTF-8">
    <!-- Mobile & iOS viewport optimization -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <title> ލިޔުންތައް</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="apple-touch-icon" href="favicon.png">

    <style>
        /* Import SanguSuruhee 2.0 WOFF font from GitHub */
       @font-face {
    font-family: 'SanguSuruhee';
    src: url('SanguSuruhee-2.0.woff') format('woff');
    font-weight: normal;
    font-style: normal;
    font-display: swap;
}

        /* Reset & Base styles */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'SanguSuruhee', -apple-system, BlinkMacSystemFont, sans-serif;
            
            /* Background Image using your Peakpx URL with a subtle overlay for text legibility */
            background-image: linear-gradient(rgba(0, 0, 0, 0.35), rgba(0, 0, 0, 0.35)), url('BG.JPG');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            
            color: #1c1c1e;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            direction: rtl;
            text-align: right;
        }

        /* Frosted Glass Mobile Card Container */
        .card {
            width: 100%;
            max-width: 400px;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            padding: 28px 24px;
            border-radius: 22px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 10px;
            color: #000000;
            line-height: 1.4;
        }

        p {
            font-size: 1.05rem;
            color: #4a4a4a;
            margin-bottom: 24px;
            line-height: 1.6;
        }

        .link-group {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        /* Tap-friendly buttons for iPhone Safari */
        .pdf-button {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: #007aff;
            color: #ffffff;
            text-decoration: none;
            padding: 16px 20px;
            border-radius: 14px;
            font-size: 1.15rem;
            line-height: 1.4;
            transition: background-color 0.2s ease, transform 0.1s ease;
            box-shadow: 0 4px 12px rgba(0, 122, 255, 0.3);
        }

        .pdf-button:active {
            background-color: #0056b3;
            transform: scale(0.98);
        }

        .pdf-button span {
            flex-grow: 1;
        }

        .icon {
            margin-left: 12px;
            font-style: normal;
            font-size: 1.25rem;
        }
    </style>
</head>
<body>

    <main class="card">
        <!-- Dhivehi Title and Description -->
        <h1>ޕީ.ޑީ.އެފް ލިޔުންތައް</h1>
        <p>ތިރީގައިވާ ލިންކުތަކުން ފައިލު ހުޅުވާލައްވާ:</p>

        <div class="link-group">
            <!-- Link for book1.pdf -->
            <a href="book1.pdf" class="pdf-button" target="_blank" rel="noopener">
                <i class="icon">📄</i>
                <span>ރަސޫލާ ނަމާދުކުރެއްވިގޮތް</span>
            </a>

            <!-- Link for book2.pdf -->
            <a href="book2.pdf" class="pdf-button" target="_blank" rel="noopener">
                <i class="icon">📄</i>
                <span>ހެނދުނާއި ހަވީރުގެ ޒިކުރު</span>
            </a>
        </div>
    </main>

</body>
</html>
